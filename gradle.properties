# JVM 参数：本容器内存有限，控制在 2G 堆 + 1G Metaspace
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# 本容器的 aapt2 是用 ARM64 静态版替换的（见 ~/.gradle/gradle.properties 的
# android.aapt2FromMavenOverride），其 `optimize` 子命令损坏（报 failed opening zip），
# 会让 release 资源产物为空、打出的 APK 缺 AndroidManifest.xml 与 resources.arsc。
# 关闭 AGP 的 release 资源优化步骤以绕过。
android.enableResourceOptimizations=false

# Kotlin
kotlin.code.style=official
